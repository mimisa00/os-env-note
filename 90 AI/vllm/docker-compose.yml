  vllm:
    image: vllm/vllm-openai:v0.26.0
    container_name: vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0','1']
              capabilities: [gpu]
    ipc: host
    ports:
      - "${VLLM_API_PORT}:8000"
    environment:
      - HF_HOME=${HF_HOME}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ./models:${HF_HOME}
    command: >
      openai/gpt-oss-20b
      --tensor-parallel-size 2
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.9
      --max-model-len 65536
      --enable-auto-tool-choice
      --tool-call-parser openai
      --reasoning-parser openai_gptoss
    restart: unless-stopped

